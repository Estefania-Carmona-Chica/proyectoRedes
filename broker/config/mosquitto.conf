# MQTT normal
listener 1883 0.0.0.0 

# MQTT seguro (TLS) - COMENTADO PARA DESARROLLO LOCAL EN WINDOWS
# (Descomentar en producción si usas certificados de Let's Encrypt)
# listener 8883 
# protocol mqtt

# Certificados
# cafile /etc/letsencrypt/live/mqtt.tefitac.win/fullchain.pem
# certfile /etc/letsencrypt/live/mqtt.tefitac.win/fullchain.pem
# keyfile /etc/letsencrypt/live/mqtt.tefitac.win/privkey.pem
# tls_version tlsv1.2

# Persistencia
persistence true
persistence_location /mosquitto/data/

# Seguridad (usuarios)
allow_anonymous true
#password_file /mosquitto/config/passwd
