<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Sistema de Riego</title>
    <!-- Importar tipografía premium Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(45, 106, 45, 0.15);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h2 {
            color: #2d6a2d;
            text-align: center;
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 28px;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            text-align: center;
            font-size: 15px;
            margin-bottom: 32px;
            font-weight: 400;
        }

        .input-group {
            position: relative;
            margin-bottom: 22px;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid #d0dbd0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 16px; /* Evita zoom automático en Safari */
            background-color: #fafdfa;
            color: #333;
            outline: none;
        }

        input:focus {
            border-color: #2d6a2d;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(45, 106, 45, 0.1);
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2d6a2d 0%, #1e4d1e 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(45, 106, 45, 0.2);
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(45, 106, 45, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-box {
                padding: 35px 24px;
                border-radius: 16px;
                box-shadow: 0 6px 15px rgba(45, 106, 45, 0.1);
            }
            h2 {
                font-size: 24px;
            }
            .subtitle {
                font-size: 14px;
                margin-bottom: 24px;
            }
            input {
                padding: 14px 16px;
                font-size: 16px;
            }
            button {
                padding: 15px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🌱 Sistema de Riego</h2>
        <div class="subtitle">Monitoreo y Control Inteligente</div>
        <form method="POST">
            <div class="input-group">
                <input type="text" name="usuario" placeholder="Nombre de usuario" required autocomplete="username">
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Contraseña" required autocomplete="current-password">
            </div>
            <button type="submit">Ingresar al Dashboard</button>
        </form>
        {% if error %}
        <div class="error">
            <span>⚠️</span> {{ error }}
        </div>
        {% endif %}
    </div>
</body>
</html>
